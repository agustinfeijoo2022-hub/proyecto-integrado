services:
  fyag:
    build: .
    env_file: .env
    environment:
      PORT: "3001"
      FRONTEND_ORIGIN: "http://localhost:8080"
      COOKIE_SECURE: "false"
      MONGODB_URI: "mongodb://mongo:27017/fyag_logs"
      FYAG_DOCKER_POSTGRES_HOST: postgres
    command:
      - node
      - --input-type=module
      - -e
      - |
        const url = new URL(process.env.DATABASE_URL);
        url.hostname = process.env.FYAG_DOCKER_POSTGRES_HOST;
        url.port = '5432';
        process.env.DATABASE_URL = url.href;
        await import('./server/index.js');
    ports:
      - "127.0.0.1:8080:3001"
    depends_on:
      - postgres
      - mongo
    restart: on-failure:5
